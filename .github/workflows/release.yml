name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.3-mac.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: WuwaTappo-*-Mac-arm64
          merge-multiple: true
          path: dist
      - name: Publish complete CN and Global Mac packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mac\.[0-9]+$ ]]
          for REGION in CN Global; do
            for EXT in zip dmg app.tar.gz app.tar.gz.sig; do
              PACKAGES=(dist/WuwaTappo-"$REGION"-Mac-*-arm64."$EXT")
              [[ ${#PACKAGES[@]} -eq 1 && -f "${PACKAGES[0]}" ]]
            done
          done
          cat > /tmp/release-notes.md <<'NOTES'
          <!-- wuwa-mac-minimum: 13.0 -->

          ## Wuwa Tappo · Unofficial macOS Community Build (CN / Global)

          Choose a file containing `CN` for a mainland China account or `Global` for a Global account. Both apps use English by default. Their accounts, settings and counters are isolated, and both can be installed together.

          Drag the app from the DMG into Applications, or extract the ZIP and move the app there. Packages include their regional interface and assets. Login and multiplayer require the corresponding official services.

          - Apple Silicon; macOS 13 or later.
          - English interface and native prompts, including update feedback.
          - Check for Updates discovers this fork’s releases, compares full Mac revisions and offers a signed regional update with Update and Restart.
          - Update dialog uses the app’s artwork, English font and cream/brown styling; automatic installation verifies signed bytes and the fork version, saves counters/session, then replaces and relaunches the app.
          - Update flow and publishing requirements: https://github.com/kyrie25/wuwa-tappo-mac/blob/main/docs/MAC_UPDATES.md
          - Upgrade from mac.4 or earlier manually once to enable future in-app updates. DMG/ZIP downloads remain available.
          - Login is remembered in macOS Keychain automatically; the app no longer asks you to choose storage at startup.
          - Official 1.0.3 resources for both regions.
          - Configurable global shortcuts with Cmd/Option labels, capture and persistence.
          - Keyboard counting and mouse interactions without Input Monitoring or Accessibility permission.
          - Ordinary key presses count once; held-key repeats, modifier-only presses and media keys are excluded.
          - Method and validation: https://github.com/kyrie25/wuwa-tappo-mac/blob/main/docs/PERMISSION_FREE_INPUT.md
          - Ad-hoc signed and not notarized by Apple. macOS may require Open Anyway in Privacy & Security.
          - No personal credentials, click history or account caches are included.
          - Community maintained and unofficial. Official assets retain their original ownership, and accounts, rewards and service rules are controlled by Kuro Games.

          ZIP and DMG contain the same app for each region. Additional .app.tar.gz packages and .sig files support automatic updates (eight files in total). Publication requires passing tests, native builds and packaging for both regions. Real account login and multiplayer still require hands-on verification.
          NOTES
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig --clobber
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig --verify-tag --title "Wuwa Tappo Mac CN / Global $TAG" --notes-file /tmp/release-notes.md --latest
          fi
