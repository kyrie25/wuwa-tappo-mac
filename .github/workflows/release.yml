name: Release

on:
  push:
    tags: ['v*-mac.*']
  workflow_dispatch:
    inputs:
      tag:
        description: Version tag; leave blank to select the next Mac revision
        required: false
        type: string
      changelog:
        description: Changelog bullet points (required unless the tag has prepared notes)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name != 'push' || github.event.created == true
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Select version, validate notes and create release tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag || (github.event_name == 'push' && github.ref_name) || '' }}
          RELEASE_CHANGELOG: ${{ inputs.changelog }}
        run: node scripts/prepare-release.mjs
      - uses: actions/upload-artifact@v7.0.2
        with:
          name: release-notes
          path: .work/release/notes.md
          include-hidden-files: true
          if-no-files-found: error
  build:
    needs: prepare
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: refs/tags/${{ needs.prepare.outputs.tag }}
  publish:
    needs: [prepare, build]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: WuwaTappo-*-Mac-arm64
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v8.0.2
        with:
          name: release-notes
          path: .work/release
      - name: Publish complete CN and Global Mac packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mac\.[0-9]+$ ]]
          for REGION in CN Global; do
            for EXT in zip dmg app.tar.gz app.tar.gz.sig; do
              PACKAGES=(dist/WuwaTappo-"$REGION"-Mac-*-arm64."$EXT")
              [[ ${#PACKAGES[@]} -eq 1 && -f "${PACKAGES[0]}" ]]
            done
          done
          NOTES=".work/release/notes.md"
          test -s "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig --verify-tag --title "$TAG" --notes-file "$NOTES" --latest
          fi
