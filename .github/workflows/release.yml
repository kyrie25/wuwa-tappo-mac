name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag, for example v1.0.3-mac.1
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    uses: ./.github/workflows/build.yml
    secrets: inherit
    with:
      ref: ${{ github.event.inputs.tag || github.ref }}
  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: WuwaTappo-*-Mac-arm64
          merge-multiple: true
          path: dist
      - name: Publish complete CN and Global Mac packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-mac\.[0-9]+$ ]]
          for REGION in CN Global; do
            for EXT in zip dmg app.tar.gz app.tar.gz.sig; do
              PACKAGES=(dist/WuwaTappo-"$REGION"-Mac-*-arm64."$EXT")
              [[ ${#PACKAGES[@]} -eq 1 && -f "${PACKAGES[0]}" ]]
            done
          done
          NOTES=".github/release-notes/$TAG.md"
          test -s "$NOTES"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig --clobber
            gh release edit "$TAG" --title "$TAG" --notes-file "$NOTES"
          else
            gh release create "$TAG" dist/*.zip dist/*.dmg dist/*.app.tar.gz dist/*.app.tar.gz.sig --verify-tag --title "$TAG" --notes-file "$NOTES" --latest
          fi
