name: Sync official regions

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-official-regions
  cancel-in-progress: false

jobs:
  check:
    name: Check official versions
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
      issues: write
    outputs:
      changed: ${{ steps.upstream.outputs.changed }}
      matrix: ${{ steps.upstream.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - name: Check official regional versions
        id: upstream
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/check-official.mjs
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: official-version-checks
          path: .work/upstream-checks
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
  sync:
    name: ${{ matrix.region }}
    needs: check
    if: always() && !cancelled() && needs.check.outputs.changed == 'true'
    runs-on: macos-26
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.check.outputs.matrix) }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      WUWA_REGION: ${{ matrix.region }}
      REGION_LABEL: ${{ matrix.label }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - uses: actions/download-artifact@v8.0.2
        with:
          name: official-version-checks
          path: .work/upstream-checks
      - name: Restore checked official version
        id: upstream
        run: |
          cp ".work/upstream-checks/$WUWA_REGION/upstream-check.json" .work/upstream-check.json
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Install build tools
        if: steps.upstream.outputs.changed == 'true'
        run: |
          test "$(uname -m)" = arm64
          rustup toolchain install 1.97.1 --profile minimal
          rustup default 1.97.1
          brew install sevenzip
      - uses: actions/cache/restore@v6.1.0
        id: cargo-cache
        if: steps.upstream.outputs.changed == 'true'
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: macos-26-arm64-${{ matrix.region }}-rust-1.97.1-${{ hashFiles('src-tauri/Cargo.lock') }}
      - name: Extract updated official resources
        id: extract
        if: steps.upstream.outputs.changed == 'true'
        run: |
          npm ci
          set -o pipefail
          node scripts/sync-upstream.mjs --update-lock 2>&1 | tee .work/upstream-extract.log
      - name: Read verified candidate installer cache identity
        id: installer
        if: steps.extract.outcome == 'success'
        run: node scripts/installer-cache.mjs
      - name: Save verified candidate official installer
        if: steps.extract.outcome == 'success'
        uses: actions/cache/save@v6.1.0
        with:
          path: ${{ steps.installer.outputs.path }}
          key: ${{ steps.installer.outputs.key }}
      - name: Record candidate contract changes without accepting them
        id: inventory
        if: steps.extract.outcome == 'success'
        run: |
          set -o pipefail
          node scripts/upstream-review.mjs inventory 2>&1 | tee .work/upstream-inventory.log
      - name: Validate frontend compatibility
        id: frontend
        if: steps.extract.outcome == 'success'
        run: |
          set -o pipefail
          { node scripts/upstream-review.mjs prepare-compatible && npm run icons && npm run prepare:frontend && npm test; } 2>&1 | tee .work/upstream-frontend.log
      - name: Test native backend
        id: native-tests
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -o pipefail
          npm run test:rust 2>&1 | tee .work/upstream-native.log
      - name: Build native application
        id: build
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -o pipefail
          npm run build -- -- --locked 2>&1 | tee .work/upstream-build.log
      - name: Package candidate
        id: validate
        if: steps.upstream.outputs.changed == 'true'
        run: |
          set -o pipefail
          npm run package 2>&1 | tee .work/package-macos.log
      - name: Keep validated packages for review
        if: steps.validate.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: official-${{ matrix.region }}-candidate
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
          retention-days: 14
      - name: Save compiled Cargo dependencies
        if: always() && steps.native-tests.outcome == 'success' && steps.cargo-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6.1.0
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ steps.cargo-cache.outputs.cache-primary-key }}
      - name: Keep upstream review evidence
        if: always() && steps.upstream.outputs.changed == 'true'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: official-${{ matrix.region }}-review
          path: |
            .work/upstream-check.json
            .work/upstream-*.log
            .work/upstream-review/*.json
            .work/package-macos.log
            upstream-${{ matrix.region }}.json
          if-no-files-found: error
          retention-days: 30
          include-hidden-files: true
      - name: Open validated update or draft requiring adaptation
        if: always() && !cancelled() && steps.extract.outcome == 'success'
        env:
          INVENTORY_OUTCOME: ${{ steps.inventory.outcome }}
          FRONTEND_OUTCOME: ${{ steps.frontend.outcome }}
          NATIVE_OUTCOME: ${{ steps.native-tests.outcome }}
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PACKAGE_OUTCOME: ${{ steps.validate.outcome }}
        run: node scripts/upstream-review.mjs open-pr
      - name: Report incompatible or unavailable upstream
        if: failure()
        run: node scripts/upstream-review.mjs report
      - name: Keep candidate merge identity
        if: always() && steps.extract.outcome == 'success'
        uses: actions/upload-artifact@v7.0.2
        with:
          name: official-${{ matrix.region }}-candidate-metadata
          path: .work/upstream-review/candidate.json
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 30
  release-compatible:
    name: Merge compatible updates and request release
    needs: [check, sync]
    if: always() && !cancelled()
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@v8.0.2
        with:
          pattern: official-*-candidate-metadata
          path: .work/sync-candidates
      - name: Merge validated candidates and dispatch Release when both regions align
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: node scripts/release-official.mjs
