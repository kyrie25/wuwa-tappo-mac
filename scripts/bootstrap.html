<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wuwa Tappo CN Mac</title>
<style>
  :root{font-family:-apple-system,BlinkMacSystemFont,sans-serif;color-scheme:light dark}
  body{margin:0;padding:36px;background:Canvas;color:CanvasText}
  h1{margin:0 0 12px;font-size:22px;font-weight:650}
  p{font-size:14px;line-height:1.6;color:GrayText;white-space:pre-wrap}
  footer{display:flex;justify-content:flex-end;gap:10px;margin-top:24px}
  button{font:inherit;padding:7px 18px;border-radius:7px;border:1px solid GrayText;background:ButtonFace;color:ButtonText;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
</style>
<h1>Wuwa Tappo · CN</h1>
<p id="status">Starting with remembered login in macOS Keychain…</p>
<footer><button id="quit">Quit</button><button id="retry" hidden>Try Again</button></footer>
<script>
  const api=window.__TAURI__;
  const status=document.getElementById('status'),retry=document.getElementById('retry');
  const update=event=>{status.textContent=event.payload.message;retry.disabled=event.payload.loading;retry.hidden=!event.payload.failed;};
  api.event.listen('mac-startup-status',update).then(()=>api.core.invoke('get_startup_status')).then(payload=>update({payload})).catch(error=>{status.textContent=String(error);retry.hidden=false});
  retry.onclick=async()=>{retry.disabled=true;try{await api.core.invoke('start_session')}catch(error){status.textContent=String(error);retry.disabled=false}};
  document.getElementById('quit').onclick=()=>api.core.invoke('exit_app');
</script>
</html>
